<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre Panier — Memora</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Styles spécifiques pour la page Panier Originale */
    .cart-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 30px;
    }

    @media (max-width: 850px) {
      .cart-container {
        grid-template-columns: 1fr;
      }
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
    }

    .cart-header h1 {
      font-size: 1.8rem;
      color: #333;
    }

    .cart-count {
      background-color: #e8d8ce;
      color: #5a3d28;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Table & Card des produits */
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 12px;
      padding: 15px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cart-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .cart-item img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-info {
      flex: 1;
      margin-left: 20px;
    }

    .cart-item-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 5px;
    }

    .cart-item-price {
      color: #777;
      font-size: 0.95rem;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 20px;
    }

    .btn-qty {
      width: 28px;
      height: 28px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-qty:hover {
      background: #f0f0f0;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 5px;
      transition: color 0.2s;
    }

    .remove-btn:hover {
      color: #c0392b;
    }

    /* Cart Summary Card */
    .cart-summary {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      height: fit-content;
    }

    .summary-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #333;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #666;
      font-size: 0.95rem;
    }

    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 15px;
    }

    .checkout-btn {
      width: 100%;
      background: #222;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      margin-top: 15px;
    }

    .checkout-btn:hover {
      background: #444;
      transform: translateY(-1px);
    }

    .promo-code {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .promo-code input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 0.9rem;
    }

    .promo-code button {
      background: #eee;
      border: none;
      padding: 0 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .promo-code button:hover {
      background: #ddd;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 50px 0;
      color: #888;
    }

    .empty-cart-msg a {
      display: inline-block;
      margin-top: 15px;
      color: #5a3d28;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Menu / Header -->
  <header>
    <div class="logo">
      <a href="index.html">Memora</a>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="produits.html">Boutique</a>
      <a href="a-propos.html">À propos</a>
      <a href="contact.html">Contact</a>
      <a href="panier.html" class="active">Panier 🛒</a>
    </nav>
  </header>

  <main class="cart-container">
    <!-- Section Produits dans le panier -->
    <section>
      <div class="cart-header">
        <h1>Mon Panier</h1>
        <span class="cart-count" id="item-count">3 Articles</span>
      </div>

      <div class="cart-items" id="cart-items-list">
        <!-- Exemple d'article 1 -->
        <article class="cart-item">
          <img src="images/produit1.jpg" alt="Coffret Memora" onerror="this.src='https://via.placeholder.com/90'">
          <div class="cart-item-info">
            <div class="cart-item-title">Coffret Memora Élégance</div>
            <div class="cart-item-price">49.00 DT</div>
          </div>
          <div class="cart-item-quantity">
            <button class="btn-qty">-</button>
            <span>1</span>
            <button class="btn-qty">+</button>
          </div>
          <button class="remove-btn" title="Supprimer">🗑️</button>
        </article>

        <!-- Exemple d'article 2 -->
        <article class="cart-item">
          <img src="images/produit2.jpg" alt="Accessoire Memora" onerror="this.src='https://via.placeholder.com/90'">
          <div class="cart-item-info">
            <div class="cart-item-title">Accessoire Personnalisé</div>
            <div class="cart-item-price">19.00 DT</div>
          </div>
          <div class="cart-item-quantity">
            <button class="btn-qty">-</button>
            <span>2</span>
            <button class="btn-qty">+</button>
          </div>
          <button class="remove-btn" title="Supprimer">🗑️</button>
        </article>
      </div>
    </section>

    <!-- Résumé de la Commande -->
    <aside class="cart-summary">
      <h2 class="summary-title">Résumé de la commande</h2>
      
      <div class="summary-row">
        <span>Sous-total</span>
        <span>87.00 DT</span>
      </div>
      <div class="summary-row">
        <span>Livraison</span>
        <span>7 DT</span>
      </div>
      <div class="summary-row">
        <span>Réduction</span>
        <span style="color: #27ae60;">-0.00 DT</span>
      </div>

      <div class="promo-code">
        <input type="text" placeholder="Code promo">
        <button>Appliquer</button>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <span>91.90 Dt</span>
      </div>

      <a href="checkout.html" class="checkout-btn">Passer la commande</a>
    </aside>
  </main>

  <footer>
    <p class="petit">&copy; 2026 Memora. Tous droits réservés.</p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
